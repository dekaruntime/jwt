name: Release stdlib tarball to R2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    # Org self-hosted only. Never ubuntu-latest / GitHub-hosted.
    runs-on: [self-hosted, macOS, ARM64]
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deka + dsc CLIs
        run: |
          VERSION="$(curl -sSf https://releases.deka.gg/latest.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)"
          curl -sSfL "https://releases.deka.gg/${VERSION}/deka-darwin-arm64" -o /tmp/deka
          chmod +x /tmp/deka
          # deka check shells out to dsc since the toolchain split. dsc has its
          # own semver (deka 0.51.0 vs dsc 0.51.2 already diverged), so resolve
          # dsc from its own latest release, never from deka's version.
          DSC_TAG="$(curl -sSf https://api.github.com/repos/dekaruntime/dsc/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)"
          curl -sSfL "https://github.com/dekaruntime/dsc/releases/download/${DSC_TAG}/dsc-darwin-arm64" -o /tmp/dsc
          chmod +x /tmp/dsc

      - name: Verify package
        run: |
          # as-package check refuses registry deps by design (the host owns
          # installs), so dep-having packages verify through their tests as
          # the consumer instead.
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('deka.json')).get('dependencies') else 1)"; then
            for t in tests/*.ds; do DEKA_DSC=/tmp/dsc /tmp/deka check "$t"; done
          else
            DEKA_DSC=/tmp/dsc /tmp/deka check --as-package .
          fi

      - name: Build tarball
        run: |
          MODULE="${{ github.event.repository.name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p /tmp/dist
          tar -czf "/tmp/dist/${MODULE}-${VERSION}.tgz" --exclude='.git' .
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=/tmp/dist/${MODULE}-${VERSION}.tgz" >> "$GITHUB_ENV"

      - name: Upload to R2 (S3 API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3api put-object \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --bucket deka-stdlib \
            --key "${MODULE}/${VERSION}/${MODULE}-${VERSION}.tgz" \
            --body "${ARCHIVE}" \
            --content-type application/gzip

      - name: Verify by reading the bytes back
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3api get-object \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --bucket deka-stdlib \
            --key "${MODULE}/${VERSION}/${MODULE}-${VERSION}.tgz" \
            /tmp/readback.tgz >/dev/null
          LOCAL=$(shasum -a 256 "${ARCHIVE}" | awk '{print $1}')
          REMOTE=$(shasum -a 256 /tmp/readback.tgz | awk '{print $1}')
          [ "$LOCAL" = "$REMOTE" ] || { echo "::error::R2 read-back hash mismatch"; exit 1; }
          echo "verified: ${MODULE}-${VERSION}.tgz ${REMOTE}"
