name: Release stdlib tarball to R2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    # Org self-hosted only. Never ubuntu-latest / GitHub-hosted.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deka CLI
        run: |
          VERSION="$(curl -sSf https://releases.deka.gg/latest.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)"
          curl -sSfL "https://releases.deka.gg/${VERSION}/deka-darwin-arm64" -o /tmp/deka
          chmod +x /tmp/deka

      - name: Verify package as an installed consumer
        run: /tmp/deka check --as-package .

      - name: Build tarball
        run: |
          MODULE="${{ github.event.repository.name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p /tmp/dist
          tar -czf "/tmp/dist/${MODULE}-${VERSION}.tgz" --exclude='.git' .
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=/tmp/dist/${MODULE}-${VERSION}.tgz" >> "$GITHUB_ENV"

      - name: Upload to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put deka-stdlib/${{ env.MODULE }}/${{ env.VERSION }}/${{ env.MODULE }}-${{ env.VERSION }}.tgz --file ${{ env.ARCHIVE }} --content-type application/gzip
